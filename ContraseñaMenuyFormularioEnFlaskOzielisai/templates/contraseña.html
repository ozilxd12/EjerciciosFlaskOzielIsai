<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de proyectos - Login</title>
    
    <!-- ENLACE CORRECTO A TU BOOTSTRAP CSS LOCAL -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4 bg-success text-white border border-white" style="width: 24rem; border-radius: 15px;">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">SISTEMA BIBLIOTECARIO</h3>
                
                <!-- Sección de Mensajes Flash -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger alert-dismissible fade show text-dark py-2 mb-3" role="alert">
                                <small>{{ message }}</small>
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Formulario -->
                <form action="/Login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario:</label>
                        <input type="text" name="usuario" class="form-control" placeholder="Introduce tu usuario" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Contraseña:</label>
                        <input type="password" name="password" class="form-control" placeholder="Introduce tu contraseña" required>
                    </div>
                    <div class="d-grid gap-2">
                        <input type="submit" value="INGRESAR" class="btn btn-light fw-bold text-success shadow-sm">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ENLACE CORRECTO A TU BOOTSTRAP JS LOCAL -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
